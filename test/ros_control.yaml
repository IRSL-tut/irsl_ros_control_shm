controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

trajectory_controller:
  ros__parameters:
    joints:
      - LINK_0
      - LINK_1
      - LINK_2
      - LINK_3
      - LINK_4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity